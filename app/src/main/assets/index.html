<!doctype html><html><head><meta charset="utf-8"><title>SHADOWBOUND V15</title><style>
body{margin:0;background:#05070b;color:#eee;font:14px system-ui;overflow:hidden}canvas{display:block;margin:auto;background:#0d1219;image-rendering:pixelated;max-width:100%;height:auto}#ui{position:fixed;left:12px;top:12px;z-index:3;background:#05070ddd;border:1px solid #39445a;border-radius:12px;padding:10px;line-height:1.45;min-width:320px}#inv{position:fixed;inset:6% 12%;background:#080b12f7;border:1px solid #66718a;border-radius:16px;padding:20px;display:none;z-index:8;box-shadow:0 20px 80px #000}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.card{border:1px solid #39445a;border-radius:10px;padding:10px;background:#111827}.sel{border-color:#9bb2ff}.muted{color:#9aa6b8}.center{position:fixed;inset:0;display:none;place-items:center;z-index:10;background:#0009}.panel{background:#090d15;border:1px solid #6b7892;border-radius:16px;padding:24px;text-align:center;min-width:360px}.tag{display:inline-block;padding:2px 6px;border:1px solid #49546b;border-radius:999px;margin-left:6px;font-size:11px}.small{font-size:12px}#mobileControls{display:block;position:fixed;inset:0;z-index:20;pointer-events:none;touch-action:none}.joy{position:absolute;left:22px;bottom:22px;width:140px;height:140px;border-radius:50%;background:#ffffff18;border:2px solid #ffffff35;pointer-events:auto}.knob{position:absolute;left:42px;top:42px;width:56px;height:56px;border-radius:50%;background:#ffffff35;border:1px solid #ffffff55}.btn{position:absolute;width:68px;height:68px;border-radius:50%;background:#101828c9;border:2px solid #aebbd6;color:#fff;font-weight:700;display:grid;place-items:center;pointer-events:auto;user-select:none;-webkit-user-select:none}.b-atk{right:120px;bottom:28px}.b-heavy{right:32px;bottom:105px}.b-dash{right:35px;bottom:25px}.b-parry{right:125px;bottom:115px}.b-jump{right:210px;bottom:35px}.mobileHint{position:absolute;right:12px;top:12px;background:#05070dcc;border:1px solid #39445a;border-radius:10px;padding:7px 10px;font-size:11px;color:#cbd5e1}@media (max-width:800px){#ui{min-width:0;left:8px;right:8px;top:8px;font-size:11px;padding:7px}#ui hr,#ui kbd{display:none}canvas{width:100vw;height:56.25vw;max-height:62vh;object-fit:contain;position:absolute;top:50%;left:50%;transform:translate(-50%,-50%)}#inv{inset:8% 5%;overflow:auto}.panel{min-width:0;width:75vw}} </style></head><body>
<div id="ui"><b>SHADOWBOUND V15 — ANDROID</b><br><span id="stats"></span><hr class="small">Touch controls active · Gamepad supported<br>Keyboard: A/D · Space · J · U · K · L · I · Q · E · P/N</div>
<div id="inv"><h2>Inventory & Arsenal</h2><div id="inventoryGrid" class="grid"></div><p class="muted">I closes. Select an ability, then Q uses it.</p></div>
<div id="overlay" class="center"><div class="panel"><h1 id="overlayTitle">SHADOWBOUND</h1><p id="overlayText"></p><button onclick="location.reload()">Restart</button></div></div>
<canvas id="game" width="1100" height="620"></canvas>
<div id="mobileControls"><div class="mobileHint">Landscape recommended</div><div id="joy" class="joy"><div id="knob" class="knob"></div></div><div class="btn b-atk" data-act="attack">ATK</div><div class="btn b-heavy" data-act="heavy">HEAVY</div><div class="btn b-dash" data-act="dash">DASH</div><div class="btn b-parry" data-act="parry">PARRY</div><div class="btn b-jump" data-act="jump">JUMP</div></div>
<script>
const c=document.getElementById('game'),ctx=c.getContext('2d');let keys={},zone=0,px=150,py=450,vx=0,vy=0,ground=true,attackT=0,attackCd=0,heavyT=0,dashT=0,parryT=0,parryCd=0,iframes=0,abilitySel=0,checkpoint=150,dead=false,invOpen=false,msg='',msgT=0;
const zones=[['Village','Safe Haven'],['Forest','Whispering Forest'],['Cave','Moonroot Cave'],['Ruins','Sunken Ruins'],['Castle','Veil Castle']];const defaults={shards:[],quests:{mira:false,keeper:false,warden:false},secret:false,ending:null,hp:100,maxHp:100,souls:0,equipped:'iron_sword',abilities:{shadow_dash:true,ground_smash:false,time_slow:false,shadow_clone:false,life_steal:false},weaponLevels:{iron_sword:1,twin_blades:0,great_sword:0},vials:3};let save=JSON.parse(localStorage.getItem('shadowbound_v15')||'null')||structuredClone(defaults);
const weapons=[{id:'iron_sword',name:'Iron Sword',damage:14,crit:.06,reach:60},{id:'twin_blades',name:'Twin Blades',damage:9,crit:.15,reach:48},{id:'great_sword',name:'Great Sword',damage:25,crit:.04,reach:74}];const abilities=[{id:'shadow_dash',name:'Shadow Dash',cost:0,desc:'Invulnerable dash'},{id:'ground_smash',name:'Ground Smash',cost:3,desc:'Area shockwave'},{id:'time_slow',name:'Time Slow',cost:5,desc:'Slow enemies'},{id:'shadow_clone',name:'Shadow Clone',cost:7,desc:'Echo strike'},{id:'life_steal',name:'Life Steal',cost:9,desc:'Recover HP'}];const shards=[{z:0,x:300,id:'village-shard'},{z:1,x:260,id:'forest-shard'},{z:1,x:850,id:'forest-shard-2'},{z:2,x:430,id:'cave-shard'},{z:2,x:900,id:'cave-shard-2'},{z:3,x:520,id:'ruins-shard'},{z:4,x:760,id:'castle-shard'}];const npcs=[{z:0,x:520,id:'mira',name:'Mira',text:'Find the Forest shard.'},{z:2,x:620,id:'keeper',name:'Cave Keeper',text:'Collect 2 Cave shards.'},{z:4,x:500,id:'warden',name:'Veil Warden',text:'Bring all shards.'}];let enemies=[];
function spawnZone(){enemies=[];const base=[{x:420,hp:55,max:55,state:'patrol'},{x:690,hp:65,max:65,state:'patrol'},{x:900,hp:70,max:70,state:'patrol'}];if(zone===1)enemies=base.map((e,i)=>({...e,id:'forest'+i}));if(zone===2)enemies=base.map((e,i)=>({...e,x:e.x-80,id:'cave'+i}));if(zone===3)enemies=base.map((e,i)=>({...e,x:e.x-120,id:'ruins'+i}));if(zone===4){enemies=base.slice(0,2).map((e,i)=>({...e,x:e.x,id:'castle'+i}));enemies.push({id:'boss',x:850,hp:260,max:260,state:'boss',boss:true,phase:1,attack:0,tele:0})}}spawnZone();
function notice(s){msg=s;msgT=150}function saveGame(){localStorage.setItem('shadowbound_v15',JSON.stringify(save));notice('Progress saved.')}function loadGame(){save=JSON.parse(localStorage.getItem('shadowbound_v15')||'null')||structuredClone(defaults);notice('Progress loaded.');renderInv()}function weapon(){return weapons.find(w=>w.id===save.equipped)}function unlocked(n){return n===0||n===1||(n===2&&save.shards.includes('forest-shard'))||(n===3&&save.quests.mira)||(n===4&&save.quests.keeper)}function setZone(n){if(!unlocked(n)){notice('Area locked.');return}zone=n;px=150;checkpoint=150;spawnZone();notice(zones[n][0]+' entered');saveGame()}function equip(id){let w=weapons.find(v=>v.id===id);if(!w)return;if(!save.weaponLevels[id]){notice('Weapon locked.');return}save.equipped=id;saveGame();renderInv()}function unlockAbility(id){let a=abilities.find(v=>v.id===id);if(!a||save.abilities[id])return;if(save.shards.length<a.cost){notice('Need '+a.cost+' shards.');return}save.abilities[id]=true;notice(a.name+' unlocked!');saveGame();renderInv()}
function damageArea(range,dmg){for(const e of enemies){let dx=e.x-px;if(Math.abs(dx)<range&&e.hp>0){let d=Math.round(dmg*(Math.random()<weapon().crit?2:1));e.hp-=d;e.stagger=25;e.vx=(dx>0?1:-1)*5;if(e.hp<=0){e.hp=0;save.souls+=e.boss?100:15;notice(e.boss?'Boss defeated!':'Enemy defeated!');if(e.boss){save.ending=save.shards.length===7?'The Shadow':'The Survivor';showOverlay('BOSS DEFEATED',save.ending+' ending path')}}}}saveGame()}function attack(){if(attackCd||dead)return;attackCd=16;attackT=12;damageArea(weapon().reach,weapon().damage)}function heavy(){if(attackCd||dead)return;attackCd=28;heavyT=22;damageArea(weapon().reach+20,weapon().damage*1.8)}function parry(){if(parryCd||dead)return;parryCd=35;parryT=18;iframes=22;notice('Parry window!')}function useAbility(){let a=abilities[abilitySel];if(!save.abilities[a.id])return unlockAbility(a.id);if(a.id==='shadow_dash'){dashT=14;iframes=18;vx=keys.a?-14:14}else if(a.id==='ground_smash'){attackT=18;damageArea(110,35)}else if(a.id==='time_slow'){enemies.forEach(e=>e.slow=240)}else if(a.id==='shadow_clone')damageArea(150,55);else if(a.id==='life_steal')save.hp=Math.min(save.maxHp,save.hp+22);saveGame()}
function interact(){for(const n of npcs)if(n.z===zone&&Math.abs(n.x-px)<90){if(n.id==='mira'&&save.shards.includes('forest-shard'))save.quests.mira=true;else if(n.id==='keeper'&&save.shards.filter(s=>s.startsWith('cave-shard')).length>=2)save.quests.keeper=true;else if(n.id==='warden'&&save.shards.length===7){save.quests.warden=true;save.ending='The Shadow';showOverlay('SECRET ENDING','The Shadow ending path is complete.')}else{notice(n.name+': '+n.text);return}notice('Quest complete!');saveGame();return}for(const s of shards)if(s.z===zone&&!save.shards.includes(s.id)&&Math.abs(s.x-px)<65){save.shards.push(s.id);notice('Shadow Shard '+save.shards.length+'/7');saveGame();return}}
function enemyAI(e){if(e.hp<=0)return;if(e.stagger>0){e.stagger--;return}let slow=e.slow>0?.45:1;if(e.slow)e.slow--;if(e.boss){if(e.hp<e.max*.5&&e.phase===1){e.phase=2;notice('VEIL WARDEN — PHASE 2')}let dx=px-e.x;e.x+=Math.sign(dx)*.8*slow;e.attack--;if(e.attack<=0){e.attack=e.phase===1?75:48;e.tele=e.phase===1?25:16;notice(e.phase===2?'Boss enrages!':'Boss telegraph!')}if(e.tele>0){e.tele--;return}if(Math.abs(dx)<110){if(iframes||parryT){e.stagger=28;notice('Boss countered!')}else save.hp-=e.phase===2?16:10}}else{let dx=px-e.x;if(Math.abs(dx)<280){e.state='chase';e.x+=Math.sign(dx)*1.25*slow}else e.x+=Math.sin(performance.now()/700+e.x)*.4;if(Math.abs(dx)<65){e.attack=(e.attack||0)-1;if(e.attack<=0){e.attack=70;if(iframes)e.stagger=20;else if(!parryT)save.hp-=7}}}}
function die(){if(save.hp>0)return;dead=true;save.hp=save.maxHp;px=checkpoint;vx=vy=0;notice('You died — respawned');setTimeout(()=>dead=false,500);saveGame()}function update(){if(dead)return;let sp=dashT>0?11:4.2;if(keys.a)vx=-sp;if(keys.d)vx=sp;if(!keys.a&&!keys.d)vx*=.78;if((keys[' ']||keys.w)&&ground){vy=-12;ground=false}vy+=.55;px+=vx;py+=vy;if(py>450){py=450;vy=0;ground=true}px=Math.max(45,Math.min(1050,px));if(attackCd>0)attackCd--;if(attackT>0)attackT--;if(heavyT>0)heavyT--;if(dashT>0)dashT--;if(parryT>0)parryT--;if(parryCd>0)parryCd--;if(iframes>0)iframes--;enemies.forEach(enemyAI);if(px>700)checkpoint=700;die();if(msgT>0)msgT--;document.getElementById('stats').textContent='HP '+Math.max(0,Math.round(save.hp))+'/'+save.maxHp+' · Souls '+save.souls+' · Shards '+save.shards.length+'/7 · '+weapon().name+' · '+(enemies.find(e=>e.boss)?'Boss '+Math.round(enemies.find(e=>e.boss).hp)+' HP':'Area '+zones[zone][0])}
function renderInv(){let g=document.getElementById('inventoryGrid');g.innerHTML='';let w=document.createElement('div');w.innerHTML='<h3>Weapons</h3>';weapons.forEach((v,i)=>{let d=document.createElement('div');d.className='card '+(save.equipped===v.id?'sel':'');d.innerHTML='<b>'+v.name+'</b> <span class="tag">'+(i+1)+'</span><br>'+((save.weaponLevels[v.id]||0)?'Unlocked':'Locked')+' · DMG '+v.damage;d.onclick=()=>equip(v.id);w.appendChild(d)});g.appendChild(w);let a=document.createElement('div');a.innerHTML='<h3>Abilities</h3>';abilities.forEach((v,i)=>{let d=document.createElement('div');d.className='card '+(abilitySel===i?'sel':'');d.innerHTML='<b>'+v.name+'</b><br>'+v.desc+' · '+v.cost+' shards · '+(save.abilities[v.id]?'Unlocked':'Locked');d.onclick=()=>{abilitySel=i;renderInv()};a.appendChild(d)});g.appendChild(a)}function showOverlay(t,s){document.getElementById('overlayTitle').textContent=t;document.getElementById('overlayText').textContent=s;document.getElementById('overlay').style.display='grid'}
addEventListener('keydown',e=>{keys[e.key]=true;let k=e.key.toLowerCase();if(k==='i'){invOpen=!invOpen;document.getElementById('inv').style.display=invOpen?'block':'none';if(invOpen)renderInv()}if(['1','2','3'].includes(e.key))equip(weapons[+e.key-1].id);if(k==='q')useAbility();if(k==='e')interact();if(k==='p')saveGame();if(k==='n')loadGame();if(k==='j')attack();if(k==='u')heavy();if(k==='l')parry()});addEventListener('keyup',e=>keys[e.key]=false);
function draw(){ctx.clearRect(0,0,c.width,c.height);let hue=[105,115,85,70,20][zone],g=ctx.createLinearGradient(0,0,0,620);g.addColorStop(0,`hsl(${hue},35%,14%)`);g.addColorStop(1,`hsl(${hue},28%,6%)`);ctx.fillStyle=g;ctx.fillRect(0,0,1100,620);ctx.fillStyle='#18212c';ctx.fillRect(0,500,1100,120);for(let i=0;i<16;i++){let tx=(i*83+25)%1100;ctx.fillStyle=zone===4?'#17131b':'#14251c';ctx.fillRect(tx,300-(i%3)*20,18,200);ctx.fillRect(tx-35,330-(i%3)*20,88,15)}ctx.fillStyle='#d9d4c8';ctx.font='bold 34px system-ui';ctx.fillText(zones[zone][0],40,55);ctx.font='16px system-ui';ctx.fillStyle='#9aa6b8';ctx.fillText(zones[zone][1],42,82);for(const s of shards)if(s.z===zone&&!save.shards.includes(s.id)){ctx.fillStyle='#8ee9ff';ctx.beginPath();ctx.moveTo(s.x,410);ctx.lineTo(s.x+12,430);ctx.lineTo(s.x,450);ctx.lineTo(s.x-12,430);ctx.closePath();ctx.fill()}for(const n of npcs)if(n.z===zone){ctx.fillStyle='#caa66a';ctx.fillRect(n.x-14,445,28,55);ctx.fillStyle='#16131a';ctx.fillRect(n.x-9,425,18,20);ctx.fillStyle='#fff';ctx.font='13px system-ui';ctx.fillText(n.name,n.x-35,410)}for(const e of enemies){if(e.hp<=0)continue;let col=e.boss?(e.phase===2?'#d45cff':'#9a6bff'):'#d45c6d';ctx.fillStyle=col;ctx.fillRect(e.x-18,e.boss?390:425,36,e.boss?110:75);ctx.fillStyle='#111';ctx.fillRect(e.x-9,e.boss?405:438,18,20);ctx.fillStyle='#e66';ctx.fillRect(e.x-25,e.boss?375:412,50,5);ctx.fillStyle='#3d0f17';ctx.fillRect(e.x-25,e.boss?375:412,50*(e.hp/e.max),5);if(e.boss){ctx.fillStyle='#fff';ctx.font='14px system-ui';ctx.fillText('VEIL WARDEN — PHASE '+e.phase,e.x-85,360)}}let pcol=iframes?'#8ee9ff':'#aab7ff';ctx.fillStyle=pcol;ctx.fillRect(px-18,py-55,36,55);ctx.fillStyle='#111';ctx.fillRect(px-9,py-43,18,18);if(attackT||heavyT){ctx.fillStyle=heavyT?'#f1d27a':'#d9d4c8';ctx.fillRect(px+15,py-32,heavyT?50:30,7)}if(parryT){ctx.strokeStyle='#8ee9ff';ctx.lineWidth=3;ctx.strokeRect(px-28,py-65,56,70)}if(msgT){ctx.fillStyle='#f1d27a';ctx.font='16px system-ui';ctx.fillText(msg,40,120)}requestAnimationFrame(()=>{update();draw()})}
const joy=document.getElementById('joy'),knob=document.getElementById('knob');function act(name){if(name==='attack')attack();else if(name==='heavy')heavy();else if(name==='dash'){dashT=14;iframes=18;vx=keys.a?-14:14}else if(name==='parry')parry();else if(name==='jump'){if(ground){vy=-12;ground=false}}}document.querySelectorAll('.btn').forEach(b=>b.addEventListener('pointerdown',e=>{e.preventDefault();act(b.dataset.act)}));let joyId=null;function joyMove(e){const r=joy.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;let dx=e.clientX-cx,dy=e.clientY-cy,max=48,mag=Math.hypot(dx,dy)||1;if(mag>max){dx=dx/mag*max;dy=dy/mag*max}knob.style.transform=`translate(${dx}px,${dy}px)`;keys.a=dx<-18;keys.d=dx>18}joy.addEventListener('pointerdown',e=>{joyId=e.pointerId;joy.setPointerCapture(joyId);joyMove(e)});joy.addEventListener('pointermove',e=>{if(e.pointerId===joyId)joyMove(e)});['pointerup','pointercancel','pointerleave'].forEach(t=>joy.addEventListener(t,e=>{if(e.pointerId===joyId){joyId=null;keys.a=false;keys.d=false;knob.style.transform='translate(0,0)'}}));let lastPad=0;function pollGamepad(){const g=(navigator.getGamepads?navigator.getGamepads():[])[0];if(g){let ax=g.axes[0]||0;keys.a=ax<-.2;keys.d=ax>.2;let pressed=g.buttons.some(b=>b.pressed);if(g.buttons[0]?.pressed&&!lastPad)act('jump');if(g.buttons[2]?.pressed&&!lastPad)act('attack');if(g.buttons[3]?.pressed&&!lastPad)act('heavy');if(g.buttons[4]?.pressed&&!lastPad)act('dash');if(g.buttons[5]?.pressed&&!lastPad)act('parry');lastPad=pressed}else lastPad=0;requestAnimationFrame(pollGamepad)}pollGamepad();renderInv();draw();
</script></body></html>
